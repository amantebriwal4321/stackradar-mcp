[project]
name = "stackradar-mcp"
version = "0.1.0"
description = "MCP server that scores developer tools with the StackRadar momentum formula, over Streamable HTTP."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aman Tebriwal" }]
keywords = ["mcp", "stackradar", "alexa", "developer-tools"]
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx>=0.27",
    "mangum>=0.19",
    "uvicorn>=0.32",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stackradar-mcp = "stackradar_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stackradar_mcp*"]

[tool.setuptools.package-data]
stackradar_mcp = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
