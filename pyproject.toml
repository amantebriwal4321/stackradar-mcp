[project]
name = "stackradar-mcp"
version = "0.1.0"
description = "Voice-ready MCP server that scores developer tools the way StackRadar does."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Aman Tebriwal" }]
keywords = ["mcp", "stackradar", "alexa", "developer-tools"]
classifiers = [
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development",
]
dependencies = [
    "mcp>=2.3.0,<3",
    "httpx>=0.27",
    "mangum>=0.19",
    "uvicorn>=0.32",
]

[project.urls]
Homepage = "https://github.com/amantebriwal4321/stackradar-mcp"
Repository = "https://github.com/amantebriwal4321/stackradar-mcp"
Issues = "https://github.com/amantebriwal4321/stackradar-mcp/issues"
Source = "https://github.com/amantebriwal4321/StackRadar"

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
stackradar-mcp = "stackradar_mcp.__main__:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["stackradar_mcp*"]

[tool.setuptools.package-data]
stackradar_mcp = ["data/*.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
